spring.application.name=pseudovoice-auth
server.port=8081

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/asistente_ia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V0__initial_schema.sql,classpath:db/migration/V1__message_turn_telemetry.sql,classpath:db/migration/V2__conversation_memories.sql,classpath:db/migration/V3__character_avatar.sql,classpath:db/migration/V4__user_roles.sql,classpath:db/migration/V5__approved_memory_groups.sql,classpath:db/migration/V6__character_source_metadata.sql,classpath:db/migration/V7__character_personality_prompt.sql,classpath:db/migration/V8__intelligent_memory.sql,classpath:db/migration/V9__agent_automation.sql,classpath:db/migration/V10__agent_public_navigation.sql,classpath:db/migration/V11__message_transcription_metadata.sql
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Google OAuth2 Client ID
google.client-id=${GOOGLE_CLIENT_ID}
google.desktop-client-id=${GOOGLE_DESKTOP_CLIENT_ID:}
google.desktop-client-secret=${GOOGLE_DESKTOP_CLIENT_SECRET:}

# Internal Service Key (Python AI Engine / Microservicios)
internal.service-key=${INTERNAL_SERVICE_KEY}
app.jwt.secret=${APP_JWT_SECRET}
pseudovoice.memory.encryption-key=${MEMORY_ENCRYPTION_KEY:}
server.error.include-message=never
